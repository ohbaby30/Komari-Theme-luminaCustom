name: Build and publish theme manually

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: npm run package

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./komari-theme.json').version")"
          branch="${GITHUB_REF_NAME:-main}"

          # test 分支追加 -test 后缀，标记为测试版
          if [[ "$branch" == "test" ]]; then
            tag="v${version}-test"
          else
            tag="v${version}"
          fi

          zip="Komari-Theme-luminaCustom-${tag}.zip"
          # 构建产物的实际文件名用的是 komari-theme.json 里的 version（无 -test），
          # 需要重命名以匹配 tag。
          original_zip="Komari-Theme-luminaCustom-v${version}.zip"
          if [[ -f "$original_zip" && "$original_zip" != "$zip" ]]; then
            mv "$original_zip" "$zip"
          fi
          test -f "$zip"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Komari-Theme-luminaCustom-${{ steps.release.outputs.tag }}
          path: |
            ${{ steps.release.outputs.zip }}
            preview.png

      - name: Create or update GitHub Release
        if: steps.release.outputs.branch != 'test'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ZIP: ${{ steps.release.outputs.zip }}
        run: |
          notes=".github/release-notes/${RELEASE_TAG}.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$notes" --latest
            else
              gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --latest
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" \
              --latest
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --latest
          fi
